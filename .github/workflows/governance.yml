name: governance

# Step 32: a high-risk spec change (or a change to the governance files) cannot merge without a
# named high-risk approver. Make "high-risk approval" a required status check on main.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: high-risk approval
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }} # run the base branch's gate, not the PR's
      - run: git fetch --no-tags origin ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - run: uv sync --all-packages --frozen
      - run: uv run python -m scripts.governance_gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
