name: template-e2e

# Step 39: a new agent project from the template, as a team would make it. copier, uv, the
# project's own CI checks, its first agent run and eval, the promotion rules and the deployment
# rules against the platform's remote base at this commit. Timed; it must take under 30 minutes.
on:
  push:
    paths:
      - "copier.yml"
      - "templates/**"
      - "libs/**"
      - "services/agent-api/**"
      - "deploy/base/**"
      - "deploy/components/**"
      - "scripts/template_e2e.py"
      - "scripts/template_data.py"
      - ".github/workflows/template-e2e.yml"
  schedule:
    - cron: "47 18 * * *" # daily 18:47 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  first-30-minutes:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      UV_FROZEN: "1"
      KUSTOMIZE_VERSION: v5.8.2
      KUSTOMIZE_SHA256: 06af0a202c2b831207d0173f9c9cdb1b30abceca0747cb3fbb72792d26055c95
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: false # a team's first run has no cache either
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: kustomize (checksum verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"; cd "$RUNNER_TEMP"
          curl -sSfL -o k.tgz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  k.tgz" | sha256sum -c -
          tar -xzf k.tgz -C bin kustomize
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: uv sync --only-group dev --no-install-workspace # copier, for the platform side
      - name: a project from the template, through its first 30 minutes
        env:
          UV_NO_CACHE: "1" # cold, as on a new laptop
        run: uv run --no-sync python -m scripts.template_e2e --ref "${{ github.sha }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: template-e2e
          path: evals/results/template/
          retention-days: 90
          if-no-files-found: warn
