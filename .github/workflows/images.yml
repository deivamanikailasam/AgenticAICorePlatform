name: images

# Step 38: the service images every environment deploys. Built once per commit, pushed to GHCR,
# scanned, given an SBOM and provenance, and signed keylessly with this workflow's identity.
# Overlays reference them only by digest (`just promote` writes the digests; see
# docs/setup/production.md). Third-party images the cluster needs are resolved to digests here
# too, so their pins can be checked against the registry.

on:
  push:
    paths:
      - "libs/**"
      - "services/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "platform.yaml"
      - "infra/compose/*.Dockerfile"
      - "deploy/third-party-images.txt"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/deivamanikailasam/agent-platform
  COSIGN_VERSION: v3.1.3
  COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
  TRIVY_VERSION: 0.75.0
  TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f

jobs:
  build:
    name: build, scan, sign ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless signing with this workflow's identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: agent-api, dockerfile: infra/compose/service.Dockerfile, package: agent-api }
          - { image: agent-worker, dockerfile: infra/compose/service.Dockerfile, package: agent-worker }
          - { image: mcp-gateway, dockerfile: infra/compose/service.Dockerfile, package: mcp-gateway }
          - { image: a2a-gateway, dockerfile: infra/compose/service.Dockerfile, package: a2a-gateway }
          - { image: ops, dockerfile: infra/compose/ops.Dockerfile, package: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tools (checksums verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/bin/cosign" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/bin/cosign" | sha256sum -c -
          curl -sSfL -o "$RUNNER_TEMP/trivy.tgz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP/bin" trivy
          chmod +x "$RUNNER_TEMP/bin/cosign" "$RUNNER_TEMP/bin/trivy"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: build and push (SBOM and provenance attached)
        id: build
        run: |
          set -euo pipefail
          docker buildx create --use --name agent-platform >/dev/null
          ref="${REGISTRY}/${{ matrix.image }}"
          docker buildx build \
            --file "${{ matrix.dockerfile }}" \
            ${{ matrix.package && format('--build-arg PACKAGE={0}', matrix.package) || '' }} \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --sbom=true --provenance=mode=max \
            --tag "${ref}:${{ github.sha }}" \
            --metadata-file "$RUNNER_TEMP/meta.json" \
            --push .
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}@${digest}" >> "$GITHUB_OUTPUT"
      - name: scan (fail on fixable critical vulnerabilities)
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trivy image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
            --format table "${{ steps.build.outputs.ref }}" | tee "$RUNNER_TEMP/scan.txt"
          trivy image --scanners vuln --ignore-unfixed --severity CRITICAL --exit-code 1 \
            --quiet "${{ steps.build.outputs.ref }}"
      - name: sign and verify (keyless, this workflow's identity)
        run: |
          set -euo pipefail
          cosign sign --yes "${{ steps.build.outputs.ref }}"
          cosign verify "${{ steps.build.outputs.ref }}" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/images.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
      - name: record the digest
        run: |
          mkdir -p out
          jq -n --arg image "${{ matrix.image }}" --arg ref "${{ steps.build.outputs.ref }}" \
            --arg digest "${{ steps.build.outputs.digest }}" --arg commit "${{ github.sha }}" \
            '{image: $image, ref: $ref, digest: $digest, commit: $commit}' > "out/${{ matrix.image }}.json"
          echo "| ${{ matrix.image }} | \`${{ steps.build.outputs.ref }}\` |" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.image }}
          path: out/${{ matrix.image }}.json
          retention-days: 90

  third-party:
    name: resolve third-party image digests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: every pinned digest still exists under its tag
        run: |
          set -euo pipefail
          status=0
          # registries rate-limit anonymous reads: three tries, 10 s apart
          digest_of() {
            for _ in 1 2 3; do
              docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}' 2>/dev/null \
                | tr -d '"' && return 0
              sleep 10
            done
            echo "::error::cannot resolve $1"; return 1
          }
          while read -r image; do
            case "$image" in ''|'#'*) continue ;; esac
            if [ "${image%% *}" = "resolve" ]; then
              tag="${image#resolve }"
              actual=$(digest_of "$tag")
              echo "::warning::not yet pinned: ${tag}@${actual}"
              echo "resolve: ${tag}@${actual}" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            tag="${image%@*}"; pinned="${image#*@}"
            if [ "$pinned" = "$image" ]; then echo "::error::$tag has no digest pin"; status=1; continue; fi
            actual=$(digest_of "$tag")
            echo "$tag -> $actual" >> "$GITHUB_STEP_SUMMARY"
            if [ "$pinned" != "$actual" ]; then
              echo "::warning::$tag is pinned to $pinned; the tag now points at $actual (the pin still holds)"
            fi
          done < deploy/third-party-images.txt
          exit $status
