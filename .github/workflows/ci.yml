name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  check:
    name: lint, types, unit, policy, config, secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: "1.21.2"
      - run: uv sync --all-packages
      - run: just check
      - name: every commit carries a plain-English change entry
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            range="$(git rev-list --max-parents=0 HEAD | tail -1)..HEAD"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          just change-entry "$range"

  integration:
    name: integration (Project 0 stand-in)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: uv sync --all-packages
      - run: just standin-up
      - name: health, provisioning and integration tests
        run: |
          set -a; . tests/stack/standin.env; set +a
          export P0_POSTGRES_DSN_INTERNAL=postgresql://agent_health:standin-only@postgres:5432/postgres
          # long-term memory (Step 20) of the services' agents lives in the agent database
          export AGENT_DB_DSN_INTERNAL=postgresql://agent_app:standin-only@postgres:5432/agent
          # Step 31: the services write the shared hash-chained audit trail
          export AGENT_AUDIT_DSN_INTERNAL=$AGENT_DB_DSN_INTERNAL
          just health
          just provision
          just migrate
          just up
          just up-alternatives
          just up-temporal
          just provision-openfga
          AGENT_REQUIRE_TEMPORAL=1 AGENT_REQUIRE_TEMPORAL_TIMESKIP=1 just test-integration
          # Step 34: every reference app's golden tasks on the stand-in gateway: no regressions
          just eval-baseline-check
          # Step 35: red-team suite (ASI01-ASI10) against the live OPA; high/critical findings fail
          just redteam --tier unit --tier integration --report evals/results/redteam/integration.json
      - if: failure()
        run: docker compose -f tests/stack/compose.p0-standin.yaml logs --tail=200

  sandbox:
    name: sandbox (gVisor)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: sudo ./scripts/install_gvisor.sh && sudo systemctl restart docker
      - run: uv sync --all-packages
      - run: just test-sandbox
      # Step 35: the sandbox tier of the red-team suite (ASI05 under gVisor)
      - run: just redteam --tier sandbox --report evals/results/redteam/sandbox.json

  microvm:
    name: sandbox (Firecracker, Kata; KVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: check
    env:
      AGENT_FIRECRACKER_DIR: /var/lib/agent-platform/firecracker
      AGENT_REQUIRE_ENGINES: firecracker,kata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - run: sudo -E ./scripts/install_firecracker.sh
      - run: sudo -E ./scripts/build_sandbox_rootfs.sh
      - run: sudo ./scripts/install_kata.sh && sudo systemctl restart docker
      - run: uv sync --all-packages
      - run: just test-microvm
