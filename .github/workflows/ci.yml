name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  check:
    name: lint, types, unit, policy, config, secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: "1.21.2"
      - run: uv sync --all-packages
      - run: just check
      - name: every commit carries a plain-English change entry
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            range="$(git rev-list --max-parents=0 HEAD | tail -1)..HEAD"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          just change-entry "$range"

  deploy:
    name: deployment manifests (render, validate, policy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KUSTOMIZE_VERSION: v5.8.2
      KUSTOMIZE_SHA256: 06af0a202c2b831207d0173f9c9cdb1b30abceca0747cb3fbb72792d26055c95
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the promotion rules compare with the base commit
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: kustomize and kubeconform (checksums verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"; cd "$RUNNER_TEMP"
          curl -sSfL -o k.tgz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  k.tgz" | sha256sum -c -
          curl -sSfL -o kc.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kc.tgz" | sha256sum -c -
          tar -xzf k.tgz -C bin kustomize && tar -xzf kc.tgz -C bin kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: uv sync --all-packages
      - run: just deploy-config-check
      - run: just deploy-check
      - name: promotion rules (dev → staging → 10% canary → prod)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          just promotion-check --base "$base"
      - run: uv run pytest -o addopts= libs/agent-governance/tests/test_deploy_policy.py

  integration:
    name: integration (Project 0 stand-in)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: check
    permissions:
      contents: read
      issues: write # Step 35: red-team findings become issues (main only)
      pull-requests: write # Step 36: eval-gate results posted to the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the eval gate compares a pull request with its base branch
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: uv sync --all-packages
      - run: just standin-up
      - name: health, provisioning and integration tests
        run: |
          set -a; . tests/stack/standin.env; set +a
          export P0_POSTGRES_DSN_INTERNAL=postgresql://agent_health:standin-only@postgres:5432/postgres
          # long-term memory (Step 20) of the services' agents lives in the agent database
          export AGENT_DB_DSN_INTERNAL=postgresql://agent_app:standin-only@postgres:5432/agent
          # Step 31: the services write the shared hash-chained audit trail
          export AGENT_AUDIT_DSN_INTERNAL=$AGENT_DB_DSN_INTERNAL
          just health
          just provision
          just migrate
          just up
          just up-alternatives
          just up-temporal
          just provision-openfga
          AGENT_REQUIRE_TEMPORAL=1 AGENT_REQUIRE_TEMPORAL_TIMESKIP=1 just test-integration
      - name: red-team suite and eval gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -a; . tests/stack/standin.env; set +a
          status=0
          # Step 35: red-team suite (ASI01-ASI10) against the live OPA; high/critical findings fail
          just redteam --tier unit --tier integration --report evals/results/redteam/integration.json || status=1
          # Step 36: eval gates (evals/gates.yaml). A pull request is judged on the apps it touches,
          # with approvals from its reviews, and the results are posted to it; a push runs them all
          if [ -n "$BASE_REF" ]; then
            just eval-gate --base "origin/$BASE_REF" --redteam evals/results/redteam/integration.json --github --comment || status=1
          else
            just eval-gate --redteam evals/results/redteam/integration.json || status=1
          fi
          exit $status
      - name: red-team findings to issues
        if: always() && github.ref == 'refs/heads/main' && hashFiles('evals/results/redteam/integration.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just redteam-issues evals/results/redteam/integration.json
      - if: failure()
        run: docker compose -f tests/stack/compose.p0-standin.yaml logs --tail=200

  sandbox:
    name: sandbox (gVisor)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: check
    permissions:
      contents: read
      issues: write # Step 35: red-team findings become issues (main only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: sudo ./scripts/install_gvisor.sh && sudo systemctl restart docker
      - run: uv sync --all-packages
      - run: just test-sandbox
      # Step 35: the sandbox tier of the red-team suite (ASI05 under gVisor)
      - run: just redteam --tier sandbox --report evals/results/redteam/sandbox.json
      - name: red-team findings to issues
        if: always() && github.ref == 'refs/heads/main' && hashFiles('evals/results/redteam/sandbox.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just redteam-issues evals/results/redteam/sandbox.json

  microvm:
    name: sandbox (Firecracker, Kata; KVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: check
    env:
      AGENT_FIRECRACKER_DIR: /var/lib/agent-platform/firecracker
      AGENT_REQUIRE_ENGINES: firecracker,kata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - run: sudo -E ./scripts/install_firecracker.sh
      - run: sudo -E ./scripts/build_sandbox_rootfs.sh
      - run: sudo ./scripts/install_kata.sh && sudo systemctl restart docker
      - run: uv sync --all-packages
      - run: just test-microvm
