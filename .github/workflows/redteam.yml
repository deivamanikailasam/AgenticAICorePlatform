name: redteam

# Step 35: the attack libraries (promptfoo, garak) against the run API on the stand-in stack.
# The suite's own attacks run in ci.yml on every push; this adds the libraries, weekly and when
# the red-team files change.
on:
  push:
    paths:
      - "evals/redteam/**"
      - "scripts/redteam*.py"
      - "libs/agent-evals/src/agent_evals/redteam*.py"
      - ".github/workflows/redteam.yml"
  schedule:
    - cron: "17 18 * * 0" # Sundays 18:17 UTC (Monday morning in Melbourne)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redteam-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libraries:
    name: attack libraries (promptfoo, garak)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write # findings become issues (main, schedule and manual runs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: uv sync --all-packages
      - run: just redteam-garak-install
      - run: just standin-up
      - name: provision, start the platform, run the attack libraries
        run: |
          set -a; . tests/stack/standin.env; set +a
          export P0_POSTGRES_DSN_INTERNAL=postgresql://agent_health:standin-only@postgres:5432/postgres
          export AGENT_DB_DSN_INTERNAL=postgresql://agent_app:standin-only@postgres:5432/agent
          export AGENT_AUDIT_DSN_INTERNAL=$AGENT_DB_DSN_INTERNAL
          just provision
          just migrate
          just up
          # the stand-in realm's test user; each attack is one run as alice through the run API
          export AGENT_REDTEAM_USER=alice AGENT_REDTEAM_PASSWORD=standin-only AGENT_REDTEAM_PROVIDER=stand-in
          status=0
          just redteam-promptfoo || status=1
          just redteam-garak || status=1
          exit $status
      - name: red-team findings to issues
        if: always() && (github.ref == 'refs/heads/main' || github.event_name != 'push')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just redteam-issues evals/results/redteam/promptfoo.json evals/results/redteam/garak.json
      - if: failure()
        run: docker compose -f tests/stack/compose.p0-standin.yaml logs --tail=200
