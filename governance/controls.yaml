      - test: libs/agent-governance/tests/test_deploy_policy.py::test_the_repository_overlays_meet_the_rules
    frameworks: { nist_ai_rmf: [MANAGE], iso42001: [A.6 AI system life cycle], eu_ai_act: [Art. 15], app: [APP 11] }
  C24:
