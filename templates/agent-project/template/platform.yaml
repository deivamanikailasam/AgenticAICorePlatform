# Platform-wide configuration (Step 5). Specs choose model *roles*; this file maps roles to
# LiteLLM gateway aliases and records what each alias can do.
platform_version: 1

gateway:
  url: ${P0_LITELLM_URL:-http://127.0.0.1:4000}
  key_env_prefix: LITELLM_KEY_      # per-role virtual keys from `just provision` (Step 1)
  timeout_seconds: 60
  max_retries: 2

models:
  roles:
    default: local-qwen-fast
    planner: local-qwen-quality
    executor: local-qwen-fast
    router: local-qwen-fast
    judge: local-qwen-quality
    summariser: local-qwen-fast
    embedder: local-embed           # Step 15: embedding routers (VERIFY-ON-MAC: Project 0's embedding alias)
  # VERIFY-ON-MAC: confirm each value against Project 0's model cards and LiteLLM config.
  capabilities:
    local-qwen-fast:    { tool_calling: true, structured_output: true, streaming: true, context_window: 32768 }
    local-qwen-quality: { tool_calling: true, structured_output: true, streaming: true, context_window: 32768 }
  fallbacks: {}                     # applied by the gateway (Project 0 Steps 7-10), listed here for docs

currency:
  usd_to_aud: 1.4434                # = 1 / 0.6928
  source: "exchange-rates.org AUD/USD history, 0.6928 on 2026-10-01"
  as_of: 2026-10-01                 # refresh monthly; cost reports state this date

components: {}                      # platform defaults per slot, e.g. { checkpointer: postgres }

# Step 7: the MCP server allowlist. A spec may only use mcp://<server>/<tool> for servers here.
# Annotations (read-only, destructive, …) from untrusted servers are ignored; side effects then
# default to `write` unless listed under `side_effects` by the platform owner.
mcp:
  servers:
    - name: filesystem
      transport: stdio
      command: npx
      args: ["-y", "@modelcontextprotocol/server-filesystem@1.0.0", "${AGENT_FS_ROOT:-/tmp/agent-fs}"]
      trusted: false
      side_effects: { read_text_file: read, read_file: read, list_directory: read, search_files: read, get_file_info: read }
      allowed_tools: [read_text_file, list_directory, search_files, get_file_info]

# Step 24: A2A. `publish` is how the a2a-gateway serves agents whose spec sets
# interop.a2a_publish; `agents` is the allowlist of remote A2A agents a spec may call as
# a2a://<name>. Each remote agent's Agent Card must be signed by one of its pinned keys.
a2a:
  publish:
    base_url: ${A2A_PUBLIC_URL:-http://127.0.0.1:8092}
    key_id: agent-platform-1
    signing_key: ${secret:agent-platform/a2a#signing_key}
    push_allowed_hosts: []
  agents: []
