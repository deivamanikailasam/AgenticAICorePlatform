# Stand-in gateway: role aliases answer with canned responses so no real model is needed.
model_list:
  - model_name: local-qwen-fast
    # stand-in prices (USD per token) so cost accounting and reconciliation are exercised (Step 26)
    litellm_params: { model: openai/fake-fast, api_key: none, mock_response: "stand-in fast", input_cost_per_token: 0.000001, output_cost_per_token: 0.000002 }
  - model_name: local-qwen-quality
    litellm_params: { model: openai/fake-quality, api_key: none, mock_response: "stand-in quality" }
  - model_name: local-qwen-json
    litellm_params: { model: openai/fake-json, api_key: none, mock_response: '{"answer": "stand-in", "confidence": 0.9}' }
  # Step 33 chaos: a model that always fails, with a gateway-side fallback to a healthy one
  - model_name: local-qwen-flaky
    litellm_params: { model: openai/fake-flaky, api_key: none, mock_response: "litellm.InternalServerError" }
router_settings:
  fallbacks: [{ "local-qwen-flaky": ["local-qwen-fast"] }]
  num_retries: 0
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
