[project]
name = "agent-compiler"
version = "0.1.0"
description = "Pattern compiler: agent.yaml -> ExecutablePlan, plus a traced runner"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-contracts",
    "agent-spec",
    "agent-runtime",
    "agent-tools",
    "opentelemetry-api>=1.45.1,<2",
    "opentelemetry-sdk>=1.45.1,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
]

[project.scripts]
agent-compile = "agent_compiler.cli:main"

[project.entry-points."agent_platform.components"]
"pattern_builder.workflow" = "agent_compiler.patterns.graph:GraphPatternBuilder"
"pattern_builder.state_machine" = "agent_compiler.patterns.graph:StateMachinePatternBuilder"
"pattern_builder.hybrid" = "agent_compiler.patterns.graph:HybridPatternBuilder"
"pattern_builder.prompt_chain" = "agent_compiler.patterns.graph:PromptChainPatternBuilder"
"pattern_builder.router" = "agent_compiler.patterns.graph:RouterPatternBuilder"
"pattern_builder.react" = "agent_compiler.patterns.react:ReactPatternBuilder"
"pattern_builder.plan_execute" = "agent_compiler.patterns.react:PlanExecutePatternBuilder"
"pattern_builder.rewoo" = "agent_compiler.patterns.react:RewooPatternBuilder"
"pattern_builder.reflection" = "agent_compiler.patterns.react:ReflectionPatternBuilder"
"pattern_builder.agentic_rag" = "agent_compiler.patterns.react:AgenticRagPatternBuilder"
"pattern_builder.supervisor" = "agent_compiler.patterns.team:SupervisorPatternBuilder"
"pattern_builder.hierarchical" = "agent_compiler.patterns.team:HierarchicalPatternBuilder"
"pattern_builder.handoff" = "agent_compiler.patterns.team:HandoffPatternBuilder"
"pattern_builder.group_chat" = "agent_compiler.patterns.team:GroupChatPatternBuilder"
"pattern_builder.map_reduce" = "agent_compiler.patterns.team:MapReducePatternBuilder"
"pattern_builder.debate" = "agent_compiler.patterns.team:DebatePatternBuilder"
"pattern_builder.evaluator_optimiser" = "agent_compiler.patterns.react:EvaluatorOptimiserPatternBuilder"

[tool.uv.sources]
agent-contracts = { workspace = true }
agent-spec = { workspace = true }
agent-runtime = { workspace = true }
agent-tools = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_compiler"]
