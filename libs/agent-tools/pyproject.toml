[project]
name = "agent-tools"
version = "0.1.0"
description = "Tool contract, registry, executor, idempotency, artefact spill, MCP, policy and rate limits"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-audit",
    "agent-contracts",
    "jsonschema>=4.26.0,<5",
    "psycopg[binary]>=3.3.6,<4",
    "redis>=8.1.0,<9",
    "boto3>=1.43.114,<2",
    "agent-spec",
    "mcp>=2.3.0,<2.4",
    "opentelemetry-api>=1.45.1,<2",
    "pyjwt[crypto]>=2.15.1,<3",
    "httpx>=0.28.1,<0.29",
    "pyyaml>=6.0.3,<7",
    # A2A v1.x (Step 24): a2a-sdk 1.2.1 released 2026-09-30 (cooldown, ADR 0022); 1.2.2 is newer
    "a2a-sdk[http-server,signing]==1.2.1",
    # the A2A gRPC binding: grpcio 1.84.0 released 2026-09-14 (cooldown, ADR 0022)
    "grpcio==1.84.0",
]

[project.entry-points."agent_platform.components"]
"tool_registry.postgres" = "agent_tools.registry:PostgresToolRegistry"
"tool_registry.in_memory" = "agent_tools.registry:InMemoryToolRegistry"
"tool_executor.platform" = "agent_tools.executor:PlatformToolExecutor"
"tool_executor.authorising" = "agent_tools.authorising:AuthorisingToolExecutor"
"policy_decision_point.opa" = "agent_tools.policy:OpaPolicyDecisionPoint"
"policy_decision_point.cerbos" = "agent_tools.policy_cerbos:CerbosPolicyDecisionPoint"
"policy_decision_point.composite" = "agent_tools.relationships:CompositePolicyDecisionPoint"
"tool.calculator" = "agent_tools.builtin:CalculatorTool"
"tool.clock" = "agent_tools.builtin:ClockTool"
"tool.word_count" = "agent_tools.builtin:WordCountTool"
"tool.rag_core_search" = "agent_tools.ragcore:RagCoreSearchTool"
"tool.sandbox_python" = "agent_tools.sandbox_tool:SandboxPythonTool"
"tool.sql_read" = "agent_tools.sql_read:SqlReadTool"
"credential_broker.openbao" = "agent_tools.openbao:OpenBaoCredentialBroker"
"credential_broker.vault" = "agent_tools.openbao:VaultCredentialBroker"
"credential_broker.aws" = "agent_tools.cloud_secrets:AwsCredentialBroker"
"credential_broker.gcp" = "agent_tools.cloud_secrets:GcpCredentialBroker"
"credential_broker.azure" = "agent_tools.cloud_secrets:AzureCredentialBroker"

[tool.uv.sources]
agent-audit = { workspace = true }
agent-contracts = { workspace = true }
agent-spec = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_tools"]

# Step 39: agent projects install the platform from git; the wheel carries its policy data
[tool.hatch.build.targets.wheel.force-include]
"../../policies/agent/config/data.json" = "agent_tools/_platform/policy-data.json"
