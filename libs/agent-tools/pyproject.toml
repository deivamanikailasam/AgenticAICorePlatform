[project]
name = "agent-tools"
version = "0.1.0"
description = "Tool contract, registry, executor, idempotency and artefact spill (Step 6); MCP and policy later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-contracts",
    "jsonschema>=4.26.0,<5",
    "psycopg[binary]>=3.3.6,<4",
    "redis>=8.1.0,<9",
    "boto3>=1.43.114,<2",
]

[project.entry-points."agent_platform.components"]
"tool_registry.postgres" = "agent_tools.registry:PostgresToolRegistry"
"tool_registry.in_memory" = "agent_tools.registry:InMemoryToolRegistry"
"tool_executor.platform" = "agent_tools.executor:PlatformToolExecutor"
"tool.calculator" = "agent_tools.builtin:CalculatorTool"
"tool.clock" = "agent_tools.builtin:ClockTool"
"tool.word_count" = "agent_tools.builtin:WordCountTool"

[tool.uv.sources]
agent-contracts = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_tools"]
