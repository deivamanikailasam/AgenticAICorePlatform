[project]
name = "agent-telemetry"
version = "0.1.0"
description = "Agent telemetry (Step 30): OpenTelemetry GenAI spans and metrics; prompt and response content only to Langfuse, redacted"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-contracts",
    "opentelemetry-api>=1.45.1,<2",
    "opentelemetry-sdk>=1.45.1,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
]

[project.entry-points."agent_platform.components"]
"telemetry_emitter.otel" = "agent_telemetry.emitter:OtelTelemetryEmitter"

[tool.uv.sources]
agent-contracts = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_telemetry"]
