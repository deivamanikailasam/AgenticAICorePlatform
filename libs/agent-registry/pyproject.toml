[project]
name = "agent-registry"
version = "0.1.0"
description = "Agent registry and discovery (Step 25): the catalogue, lifecycle, approved-only gate and catalogue export"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-contracts",
    "agent-spec",
    "psycopg[binary]>=3.3.6,<4",
    "pyyaml>=6.0.3,<7",
]

[project.entry-points."agent_platform.components"]
"agent_registry.postgres" = "agent_registry.postgres:PostgresAgentRegistry"
"agent_registry.backstage" = "agent_registry.backstage:BackstageCatalogRegistry"

[tool.uv.sources]
agent-contracts = { workspace = true }
agent-spec = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_registry"]
