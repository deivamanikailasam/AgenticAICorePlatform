[project]
name = "agent-testing"
version = "0.1.0"
description = "Testing pyramid support (Step 33): record-and-replay cassettes for model and tool calls"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-contracts",
]

[tool.uv.sources]
agent-contracts = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_testing"]
