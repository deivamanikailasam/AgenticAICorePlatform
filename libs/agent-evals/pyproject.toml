[project]
name = "agent-evals"
version = "0.1.0"
description = "Agent evaluation harness (Step 34): golden task sets, deterministic checkers, a rubric-based judge with calibration against human labels, versioned results and comparison"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-contracts",
    "jsonschema>=4.26.0,<5",
    "pyyaml>=6.0.3,<7",
]

[tool.uv.sources]
agent-contracts = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_evals"]
