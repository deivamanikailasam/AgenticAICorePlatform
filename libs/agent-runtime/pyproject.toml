[project]
name = "agent-runtime"
version = "0.1.0"
description = "Model access through the gateway (Step 5) and runtime adapters (Step 11)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-contracts",
    "agent-spec",
    "httpx>=0.28.1,<0.29",
    "jsonschema>=4.26.0,<5",
    # exact pins with a 14-day cooldown (ADR 0022): langgraph 1.2.12 was released 2026-09-21
    "langgraph==1.2.12",
    # Microsoft Agent Framework (workflows only; no model providers): 1.19.0 released 2026-09-18
    "agent-framework-core==1.19.0",
    # OpenAI Agents SDK as an agent-loop engine (models stay on the platform gateway): 0.22.3,
    # released 2026-09-17
    "openai-agents==0.22.3",
    # Pydantic AI (slim: no provider SDKs) as an agent-loop engine: 2.52.0, released 2026-09-30
    "pydantic-ai-slim==2.52.0",
]

[project.entry-points."agent_platform.components"]
"model_client.litellm" = "agent_runtime.models.gateway:GatewayModelClient"
"runtime_adapter.langgraph" = "agent_runtime.adapters.langgraph:LangGraphAdapter"
"runtime_adapter.agent_framework" = "agent_runtime.adapters.agent_framework:AgentFrameworkAdapter"
"runtime_adapter.crewai" = "agent_runtime.adapters.stubs:CrewAIAdapter"
"agent_loop.native" = "agent_runtime.agent_loop:AgentLoopExecutor"
"planner.llm" = "agent_runtime.reasoning:LlmPlanner"
"critic.llm" = "agent_runtime.reasoning:LlmCritic"
"agent_loop.openai_agents" = "agent_runtime.engines.openai_agents:OpenAIAgentsLoopExecutor"
"agent_loop.pydantic_ai" = "agent_runtime.engines.pydantic_ai:PydanticAILoopExecutor"
"agent_loop.google_adk" = "agent_runtime.engines.stubs:GoogleAdkLoopStub"

[tool.uv.sources]
agent-contracts = { workspace = true }
agent-spec = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]
