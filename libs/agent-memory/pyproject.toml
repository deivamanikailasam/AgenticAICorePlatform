[project]
name = "agent-memory"
version = "0.1.0"
description = "Long-term memory (Step 20): stores, the write policy and the memory service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-contracts",
    "agent-runtime",
    "psycopg[binary]>=3.3.6,<4",
    # Qdrant (Project 0) as the memory_store alternative: 1.19.1 released 2026-09-16 (ADR 0022)
    "qdrant-client==1.19.1",
]

[project.entry-points."agent_platform.components"]
"memory_store.pgvector" = "agent_memory.pgvector:PgVectorMemoryStore"
"memory_store.qdrant" = "agent_memory.qdrant:QdrantMemoryStore"
"memory_policy.validating" = "agent_memory.policy:ValidatingMemoryPolicy"
"memory_policy.human_curated" = "agent_memory.policy:HumanCuratedMemoryPolicy"

[tool.uv.sources]
agent-contracts = { workspace = true }
agent-runtime = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory"]
