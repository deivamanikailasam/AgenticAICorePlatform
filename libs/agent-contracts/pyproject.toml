[project]
name = "agent-contracts"
version = "0.1.0"
description = "Interfaces, shared models and the component registry for the Agentic AI Core Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14.1,<3",
    "jsonschema>=4.26.0,<5",
]

[project.optional-dependencies]
testing = ["pytest>=9.1.1,<10", "pytest-asyncio>=1.4.0,<2"]

[project.scripts]
agent-components = "agent_contracts.registry:main"

[project.entry-points."agent_platform.components"]
"model_client.echo" = "agent_contracts.dummies.models:EchoModelClient"
"model_client.scripted" = "agent_contracts.dummies.models:ScriptedModelClient"
"tool.echo" = "agent_contracts.dummies.tools:EchoTool"
"tool.add" = "agent_contracts.dummies.tools:AddTool"
"tool_registry.memory" = "agent_contracts.dummies.tools:InMemoryToolRegistry"
"tool_registry.indexed" = "agent_contracts.dummies.tools:IndexedToolRegistry"
"tool_executor.local" = "agent_contracts.dummies.tools:LocalToolExecutor"
"tool_executor.retrying" = "agent_contracts.dummies.tools:RetryingToolExecutor"
"pattern_builder.single" = "agent_contracts.dummies.runtime:SingleNodePattern"
"pattern_builder.chain" = "agent_contracts.dummies.runtime:ChainPattern"
"runtime_adapter.sequential" = "agent_contracts.dummies.runtime:SequentialRuntimeAdapter"
"runtime_adapter.stepwise" = "agent_contracts.dummies.runtime:StepwiseRuntimeAdapter"
"checkpointer.memory" = "agent_contracts.dummies.state:InMemoryCheckpointer"
"checkpointer.sqlite" = "agent_contracts.dummies.state:SqliteCheckpointer"
"durable_executor.inline" = "agent_contracts.dummies.state:InlineDurableExecutor"
"durable_executor.deferred" = "agent_contracts.dummies.state:DeferredDurableExecutor"
"memory_store.memory" = "agent_contracts.dummies.state:InMemoryMemoryStore"
"memory_store.sqlite" = "agent_contracts.dummies.state:SqliteMemoryStore"
"memory_policy.validate_redact" = "agent_contracts.dummies.context:ValidateRedactMemoryPolicy"
"memory_policy.read_only" = "agent_contracts.dummies.context:ReadOnlyMemoryPolicy"
"context_manager.trim" = "agent_contracts.dummies.context:TrimContextManager"
"context_manager.summary_stub" = "agent_contracts.dummies.context:SummaryStubContextManager"
"guardrail.keyword_injection" = "agent_contracts.dummies.safety:KeywordInjectionGuardrail"
"guardrail.regex_pii" = "agent_contracts.dummies.safety:RegexPiiGuardrail"
"policy_decision_point.rules" = "agent_contracts.dummies.safety:RulesPolicyDecisionPoint"
"policy_decision_point.deny_all" = "agent_contracts.dummies.safety:DenyAllPolicyDecisionPoint"
"approval_gate.memory" = "agent_contracts.dummies.safety:InMemoryApprovalGate"
"approval_gate.ttl" = "agent_contracts.dummies.safety:TtlApprovalGate"
"budget_controller.memory" = "agent_contracts.dummies.safety:InMemoryBudgetController"
"budget_controller.ledger" = "agent_contracts.dummies.safety:LedgerBudgetController"
"loop_detector.repeat" = "agent_contracts.dummies.safety:RepeatLoopDetector"
"loop_detector.no_progress" = "agent_contracts.dummies.safety:NoProgressLoopDetector"
"planner.single_step" = "agent_contracts.dummies.reasoning:SingleStepPlanner"
"planner.per_tool" = "agent_contracts.dummies.reasoning:PerToolPlanner"
"router.keyword" = "agent_contracts.dummies.reasoning:KeywordRouter"
"router.first" = "agent_contracts.dummies.reasoning:FirstRouter"
"critic.length" = "agent_contracts.dummies.reasoning:LengthCritic"
"critic.overlap" = "agent_contracts.dummies.reasoning:OverlapCritic"
"telemetry_emitter.memory" = "agent_contracts.dummies.observability:MemoryTelemetryEmitter"
"telemetry_emitter.noop" = "agent_contracts.dummies.observability:NoopTelemetryEmitter"
"audit_sink.memory" = "agent_contracts.dummies.observability:MemoryAuditSink"
"audit_sink.jsonl" = "agent_contracts.dummies.observability:JsonlAuditSink"
"evaluator.exact_match" = "agent_contracts.dummies.evals:ExactMatchEvaluator"
"evaluator.tool_recall" = "agent_contracts.dummies.evals:ToolRecallEvaluator"
"simulator.scripted_user" = "agent_contracts.dummies.evals:ScriptedUserSimulator"
"simulator.patient_user" = "agent_contracts.dummies.evals:PatientUserSimulator"
"code_sandbox.unavailable" = "agent_contracts.dummies.sandbox:UnavailableSandbox"
"code_sandbox.scripted" = "agent_contracts.dummies.sandbox:ScriptedSandbox"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_contracts"]
