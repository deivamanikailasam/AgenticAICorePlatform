[project]
name = "agent-sdk"
version = "0.1.0"
description = "The platform's public SDK (Step 39): custom tools, functions, patterns and evaluators, and agentctl (validate, run, eval, promote) for agent projects"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-api",
    "agent-compiler",
    "agent-contracts",
    "agent-evals",
    "agent-governance",
    "agent-spec",
    "agent-tools",
    "httpx>=0.28.1,<0.29",
    "pyyaml>=6.0.3,<7",
]

[project.scripts]
agentctl = "agent_sdk.cli:main"

[tool.uv.sources]
agent-api = { workspace = true }
agent-compiler = { workspace = true }
agent-contracts = { workspace = true }
agent-evals = { workspace = true }
agent-governance = { workspace = true }
agent-spec = { workspace = true }
agent-tools = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_sdk"]
