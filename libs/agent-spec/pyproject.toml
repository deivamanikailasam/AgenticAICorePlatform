[project]
name = "agent-spec"
version = "0.1.0"
description = "agent.yaml: schema, loader, semantic validation and migrations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-contracts",
    "pydantic>=2.14.1,<3",
    "pyyaml>=6.0.3,<7",
]

[project.scripts]
agent-spec = "agent_spec.cli:main"

[tool.uv.sources]
agent-contracts = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_spec"]

# Step 39: agent projects install the platform from git; the wheel carries its default config
[tool.hatch.build.targets.wheel.force-include]
"../../platform.yaml" = "agent_spec/_platform/platform.yaml"
