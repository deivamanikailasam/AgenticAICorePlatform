[project]
name = "agent-audit"
version = "0.1.0"
description = "Agent audit trail (Step 31): event catalogue, versions and trace ids on every event, redacted arguments, a hash-chained Postgres sink, the verifier and run reconstruction"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-contracts",
    "agent-guardrails",
    "opentelemetry-api>=1.45.1,<2",
    "psycopg[binary]>=3.3.6,<4",
]

[project.entry-points."agent_platform.components"]
"audit_sink.postgres" = "agent_audit.postgres:PostgresAuditSink"

[tool.uv.sources]
agent-contracts = { workspace = true }
agent-guardrails = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_audit"]
