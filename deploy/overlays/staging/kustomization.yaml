# staging: changed only by a reviewed pull request (`just promote`); Argo CD syncs it. 2 replicas of
# each stateless service, workers scaled by KEDA between 1 and 4, Temporal cluster in
# namespace temporal-staging. Images by digest only.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-platform-staging
resources:
  - namespace.yaml
  - ../../base
components:
  - ../../components/cluster
  # the versions deploy/releases/staging.yaml names (generated: just deploy-config)
  - released
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
configMapGenerator:
  - name: agent-platform-env
    envs: [env.properties]
replicas:
  - { name: agent-api, count: 2 }
  - { name: mcp-gateway, count: 2 }
  - { name: a2a-gateway, count: 2 }
patches:
  - target: { kind: ScaledObject, name: agent-worker }
    patch: |-
      - { op: replace, path: /spec/minReplicaCount, value: 1 }
      - { op: replace, path: /spec/maxReplicaCount, value: 4 }
      - { op: replace, path: /spec/triggers/0/metadata/endpoint, value: "temporal-frontend.temporal-staging.svc:7233" }
  - target: { kind: NetworkPolicy, name: egress-temporal-cluster }
    patch: |-
      - op: replace
        path: /spec/egress/0/to/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: temporal-staging
# images from commit 1ba03915d1286e051ef72b082eefbe7a61542adf (images workflow; signed, scanned)
images:
  - { name: agent-platform/agent-api, newName: ghcr.io/deivamanikailasam/agent-platform/agent-api, digest: "sha256:5bef8d857589de130c4dfae13730cc4ea0990c35caf632757f34130118476dec" }
  - { name: agent-platform/agent-worker, newName: ghcr.io/deivamanikailasam/agent-platform/agent-worker, digest: "sha256:cb522dd6c5aa8baf5a425218d582072c402f0bfecf520e287929cc7bce483dcb" }
  - { name: agent-platform/mcp-gateway, newName: ghcr.io/deivamanikailasam/agent-platform/mcp-gateway, digest: "sha256:0469ee8efea7fc4f8f11303794f1f0b0496b754eb373c8fac0cfa5499128a41e" }
  - { name: agent-platform/a2a-gateway, newName: ghcr.io/deivamanikailasam/agent-platform/a2a-gateway, digest: "sha256:344c2c6adb7e068b4e218a562efb5334f99bcdac1f74a386f5e792d2232ee32a" }
  - { name: agent-platform/ops, newName: ghcr.io/deivamanikailasam/agent-platform/ops, digest: "sha256:c8e212a88f3adcd273a84cd028892bc28fe783bbe6d3c202944294294655703e" }
