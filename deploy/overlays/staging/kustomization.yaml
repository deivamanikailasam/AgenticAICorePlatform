# staging: changed only by a reviewed pull request (`just promote`); Argo CD syncs it. 2 replicas of
# each stateless service, workers scaled by KEDA between 1 and 4, Temporal cluster in
# namespace temporal-staging. Images by digest only.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-platform-staging
resources:
  - namespace.yaml
  - ../../base
components:
  - ../../components/cluster
  # the versions deploy/releases/staging.yaml names (generated: just deploy-config)
  - released
configMapGenerator:
  - name: agent-platform-env
    envs: [env.properties]
replicas:
  - { name: agent-api, count: 2 }
  - { name: mcp-gateway, count: 2 }
  - { name: a2a-gateway, count: 2 }
patches:
  - target: { kind: ScaledObject, name: agent-worker }
    patch: |-
      - { op: replace, path: /spec/minReplicaCount, value: 1 }
      - { op: replace, path: /spec/maxReplicaCount, value: 4 }
      - { op: replace, path: /spec/triggers/0/metadata/endpoint, value: "temporal-frontend.temporal-staging.svc:7233" }
  - target: { kind: NetworkPolicy, name: egress-temporal-cluster }
    patch: |-
      - op: replace
        path: /spec/egress/0/to/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: temporal-staging
# images from commit 4ff80dc4ae9995f5f78286527b331793e6056e2b (images workflow; signed, scanned)
images:
  - { name: agent-platform/agent-api, newName: ghcr.io/deivamanikailasam/agent-platform/agent-api, digest: "sha256:f7ce30cc87e6ca1cacc042d8014576f182ec923f8e9ffd2b9ec6f39ecd4f2b67" }
  - { name: agent-platform/agent-worker, newName: ghcr.io/deivamanikailasam/agent-platform/agent-worker, digest: "sha256:5f5d87a31390d66189a7c38d2356ebdd235941b400d97ee0d8dd8a2671422d51" }
  - { name: agent-platform/mcp-gateway, newName: ghcr.io/deivamanikailasam/agent-platform/mcp-gateway, digest: "sha256:8431c16e5b143fd798fcc186010b9fa6c68a3703b9d224602ba9af270043d371" }
  - { name: agent-platform/a2a-gateway, newName: ghcr.io/deivamanikailasam/agent-platform/a2a-gateway, digest: "sha256:4f5b9575deec4c177b6fbfd837cca32c9df521b75b1244fc707228d65721f1cf" }
  - { name: agent-platform/ops, newName: ghcr.io/deivamanikailasam/agent-platform/ops, digest: "sha256:e123727887f29d6c420165368842dc67e6de80d640b2974a292c9f11bb416ea8" }
