# dev: synced automatically from main by Argo CD (deploy/argocd). One replica each, a Temporal
# development server, the specs at main's head. Images by digest only (`just promote` writes them).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-platform-dev
resources:
  - namespace.yaml
  - ../../base
components:
  - ../../components/temporal-dev
  - ../../components/head-specs
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
configMapGenerator:
  - name: agent-platform-env
    envs: [env.properties]
# images from commit 91fd4b0779b8a8e20c8f63351260026aa6c967e5 (images workflow; signed, scanned)
images:
  - { name: agent-platform/agent-api, newName: ghcr.io/deivamanikailasam/agent-platform/agent-api, digest: "sha256:2100e5a678d41ca74a7b60f4464ff27e44e7b08a3add931375c978070151e816" }
  - { name: agent-platform/agent-worker, newName: ghcr.io/deivamanikailasam/agent-platform/agent-worker, digest: "sha256:55f420c2fabf4587c29fed1f2584600d1fc30f28814157daab94f68b8604a47c" }
  - { name: agent-platform/mcp-gateway, newName: ghcr.io/deivamanikailasam/agent-platform/mcp-gateway, digest: "sha256:c1580543cd8533b810e5b118be3f3b3f33d13da9713d05dfa53b8b4a3be7763f" }
  - { name: agent-platform/a2a-gateway, newName: ghcr.io/deivamanikailasam/agent-platform/a2a-gateway, digest: "sha256:b4785c63482cf4ed8121e91746cc08c6453a0c80198a9555fa393f77f5e2d8b5" }
  - { name: agent-platform/ops, newName: ghcr.io/deivamanikailasam/agent-platform/ops, digest: "sha256:d7d63fe73d1c50120adc6187e96e4321212f93f22287489b6e6266990624c6eb" }
