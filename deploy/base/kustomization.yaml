# Project A on Kubernetes (Step 38): the services, hardened, without anything environment-specific.
# Overlays (deploy/overlays/<env>) add the namespace, replicas, endpoints, OpenBao role, image
# digests, autoscaling and the agent specs: dev mounts agents/ at main's head
# (components/head-specs), staging and prod the versions their releases file names. Build with `--load-restrictor LoadRestrictionsNone`: the agent specs
# and data-lifecycle policy are read from their home in the repo, not copied.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: agent-platform
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false
resources:
  - serviceaccounts.yaml
  - agent-api.yaml
  - agent-worker.yaml
  - mcp-gateway.yaml
  - a2a-gateway.yaml
  - migrate-job.yaml
  - networkpolicies.yaml
# Argo CD sync order: what the migration Job and the pods need exists first (wave -2)
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
configMapGenerator:
  # a generated copy of governance/data-lifecycle.yaml (just deploy-config), so the base builds
  # on its own, also as a remote base of an agent project (Step 39)
  - name: data-lifecycle
    files:
      - data-lifecycle.yaml
patches:
  - target: { kind: "ServiceAccount|NetworkPolicy" }
    patch: |-
      - op: add
        path: /metadata/annotations
        value: { argocd.argoproj.io/sync-wave: "-2" }
