# The run API (Step 17). Stateless across replicas: runs, events and checkpoints are in the agent
# database, and each run is driven by the replica that holds its lease (Step 38).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-api
  labels: { app.kubernetes.io/name: agent-api, agent-platform/specs: mounted }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: agent-api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: agent-api, app.kubernetes.io/part-of: agent-platform }
    spec:
      serviceAccountName: agent-api
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: agent-api } }
      containers:
        - name: agent-api
          image: agent-platform/agent-api
          command: ["agent-api"]
          ports:
            - { name: http, containerPort: 8091 }
          envFrom:
            - configMapRef: { name: agent-platform-env }
          env:
            - { name: AGENT_API_HOST, value: "0.0.0.0" }
            - { name: AGENT_API_PORT, value: "8091" }
            - { name: AGENT_API_AGENTS_DIR, value: /app/agents }
            - { name: AGENT_DATA_LIFECYCLE, value: /app/governance/data-lifecycle.yaml }
            - { name: AGENT_API_AUDIT_FILE, value: /tmp/agent-api-audit.jsonl }
            - { name: AGENT_API_STORE, value: postgres }
            - { name: AGENT_REGISTRY_FILE, value: /tmp/agents.db }
            # this replica's address, so others can reach the run it drives (Step 38)
            - name: AGENT_API_POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 6
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 40
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: openbao-token, mountPath: /var/run/secrets/openbao, readOnly: true }
            - { name: data-lifecycle, mountPath: /app/governance, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: openbao-token
          projected:
            sources:
              - serviceAccountToken: { audience: openbao, expirationSeconds: 600, path: token }
        - name: data-lifecycle
          configMap: { name: data-lifecycle }
---
apiVersion: v1
kind: Service
metadata:
  name: agent-api
  labels: { app.kubernetes.io/name: agent-api }
spec:
  selector: { app.kubernetes.io/name: agent-api }
  ports:
    - { name: http, port: 8091, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-api
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: agent-api }
