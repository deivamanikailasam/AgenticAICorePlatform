# One identity per service. No Kubernetes API token is mounted (automount off); each pod gets a
# short-lived token for OpenBao only (audience "openbao", see the Deployments).
apiVersion: v1
kind: ServiceAccount
metadata: { name: agent-api }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: agent-worker }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: mcp-gateway }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: a2a-gateway }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: agent-db-migrate }
automountServiceAccountToken: false
