# The `temporal-db` Secret the chart reads, kept in sync with OpenBao's staging mount. The
# SecretStore authenticates with this namespace's service-account token (Kubernetes auth).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.rag-platform.svc:8200
      path: agent-platform-staging
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: temporal-staging
          serviceAccountRef: { name: default, audiences: [openbao] }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-db
spec:
  refreshInterval: 15m
  secretStoreRef: { name: openbao, kind: SecretStore }
  target: { name: temporal-db, creationPolicy: Owner }
  data:
    - secretKey: password
      remoteRef: { key: temporal/db, property: password }
