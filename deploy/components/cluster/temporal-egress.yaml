apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: egress-temporal-cluster }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/part-of: agent-platform } }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: temporal } }
          podSelector: { matchLabels: { app.kubernetes.io/component: frontend } }
      ports:
        - { protocol: TCP, port: 7233 }
