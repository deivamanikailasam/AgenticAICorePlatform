spec_version: 1
name: policy-debate-con
version: 0.1.0
owner: agent-platform
description: Argues against the proposal.
risk_tier: low
autonomy: hybrid
pattern: hybrid
models: { default: local-qwen-fast }
runtime: { adapter: langgraph, durability: memory }
budgets: { max_steps: 4, max_tokens: 8000, max_cost_aud: 0.05, max_wall_seconds: 60 }
graph:
  nodes:
    - id: act
      type: agent
      pattern: react
      config:
        template: "Proposal: $input.task. Round $input.round. Debate so far: $input.transcript. Argue against it."
        output_schema: { type: object, properties: { argument: { type: string } }, required: [argument] }
