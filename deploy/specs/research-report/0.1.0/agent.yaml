# Reference app (Step 22): a supervisor and three workers write a short research report.
# Each worker is its own spec with its own tools and budget; workers see only the shared-state
# fields they read, and may set only the fields they write.
spec_version: 1
name: research-report
version: 0.1.0
owner: agent-platform
description: Researches a question, works out the figures and writes a short cited report.
risk_tier: low
autonomy: multi_agent
pattern: supervisor
models: { default: local-qwen-fast, planner: local-qwen-quality }
runtime: { adapter: langgraph, durability: checkpoint }
budgets: { max_steps: 12, max_tokens: 60000, max_cost_aud: 0.50, max_wall_seconds: 300 }
agents:
  - { name: researcher, spec: workers/researcher.yaml, role: "Finds sources with quotes", reads: [task], writes: [sources] }
  - { name: analyst, spec: workers/analyst.yaml, role: "Computes the figures the report needs", reads: [task, sources], writes: [figures] }
  - { name: writer, spec: workers/writer.yaml, role: "Writes the cited report", reads: [task, sources, figures], writes: [report] }
supervisor:
  dispatcher: llm            # rules: deterministic order by reads/writes, no model
  model: planner
  max_rounds: 6
  max_depth: 3
  max_failures: 2
  output: report
  state:
    sources:
      type: array
      minItems: 1
      items: { type: object, properties: { title: { type: string }, quote: { type: string } }, required: [title, quote] }
    figures:
      type: object
      additionalProperties: { type: number }
    report: { type: string, minLength: 20 }
