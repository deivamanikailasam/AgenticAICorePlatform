spec_version: 1
name: review-chat-writer
version: 0.1.0
owner: agent-platform
description: Drafts and revises the text.
risk_tier: low
autonomy: hybrid
pattern: hybrid
models: { default: local-qwen-fast }
runtime: { adapter: langgraph, durability: memory }
budgets: { max_steps: 4, max_tokens: 8000, max_cost_aud: 0.05, max_wall_seconds: 60 }
graph:
  nodes:
    - id: act
      type: agent
      pattern: react
      config:
        template: "Task: $input.task. Conversation so far: $input.transcript. Write or revise the draft."
        output_schema: { type: object, properties: { message: { type: string } }, required: [message] }
