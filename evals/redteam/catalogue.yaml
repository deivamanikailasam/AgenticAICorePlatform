# Red-team register (Step 35): the OWASP Top 10 for Agentic Applications (ASI01-ASI10, December
# 2025) with the platform's controls (spec: threat model), and the existing tests that prove a
# control. Scenario attacks live in attacks/*.yaml. `just redteam --check` verifies that every
# category has automated tests and that every node below still exists.
#
# severity: what it would mean if the test failed. critical/high findings block a release.
# tier: unit (no services), integration (stand-in stack), sandbox (gVisor).
categories:
  ASI01:
    name: Agent goal hijack
    controls: [untrusted-content delimiting, injection detection on retrieved and tool content, tool allowlists per agent, approvals on sensitive actions]
    steps: [21, 27, 28]
  ASI02:
    name: Tool misuse and exploitation
    controls: [typed tool schemas, argument value checks, side-effect classes, OPA per call, rate limits]
    steps: [6, 10, 27]
  ASI03:
    name: Identity and privilege abuse
    controls: [per-agent identity, on-behalf-of down-scoped tokens, short-lived credentials from OpenBao, access reviews]
    steps: [10, 29]
  ASI04:
    name: Agentic supply chain
    controls: [allowlisted MCP servers and A2A agents, signed Agent Cards, pinned and scanned images and packages, tool and agent inventory]
    steps: [7, 24, 25, 32]
  ASI05:
    name: Unexpected code execution
    controls: [gVisor sandbox, no network by default, resource caps, no host mounts]
    steps: [9]
  ASI06:
    name: Memory and context poisoning
    controls: [memory write policy, provenance tags, validation, TTLs, inspect-and-flush tooling]
    steps: [20, 21]
  ASI07:
    name: Insecure inter-agent communication
    controls: [mutual authentication, signed cards, OPA on delegation, messages treated as data]
    steps: [22, 23, 24]
  ASI08:
    name: Cascading failures
    controls: [budgets that roll up, delegation limits, circuit breakers, environment separation]
    steps: [26, 38]
  ASI09:
    name: Human-agent trust exploitation
    controls: [approval screens show the raw action and arguments, approval bound to the exact call, what was shown is audited]
    steps: [28, 31]
  ASI10:
    name: Rogue agents
    controls: [behavioural metrics and alerts, registry lifecycle with owner and expiry, kill switch per agent and per tenant]
    steps: [25, 30, 38]

tests:
