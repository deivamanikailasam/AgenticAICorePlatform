[project]
name = "agent-api"
version = "0.1.0"
description = "Run API (Step 17): create, stream (AG-UI over SSE or WebSocket), state, cancel, resume, threads and approvals, behind Keycloak"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-audit",
    "agent-evals",
    "agent-telemetry",
    "agent-contracts",
    "agent-spec",
    "agent-tools",
    "agent-runtime",
    "agent-compiler",
    "agent-memory",
    "agent-registry",
    "agent-guardrails",
    "ag-ui-protocol==1.0.0",
    "httpx>=0.28.1,<0.29",
    "starlette>=0.48",
    "uvicorn>=0.54.0,<1",
]

[project.scripts]
agent-api = "agent_api.__main__:main"

[project.entry-points."agent_platform.eval_apps"]
"hello-workflow" = "agent_api.eval_apps:hello_workflow"
"support-handoff" = "agent_api.eval_apps:support_handoff"
"research-report" = "agent_api.eval_apps:research_report"
"review-chat" = "agent_api.eval_apps:review_chat"
"batch-summary" = "agent_api.eval_apps:batch_summary"
"policy-debate" = "agent_api.eval_apps:policy_debate"

[tool.uv.sources]
agent-audit = { workspace = true }
agent-evals = { workspace = true }
agent-telemetry = { workspace = true }
agent-contracts = { workspace = true }
agent-spec = { workspace = true }
agent-tools = { workspace = true }
agent-runtime = { workspace = true }
agent-compiler = { workspace = true }
agent-memory = { workspace = true }
agent-registry = { workspace = true }
agent-guardrails = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_api"]
