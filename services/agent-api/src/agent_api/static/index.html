<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent runs</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#57534e; --line:#d6d3d1; --card:#fff; --ok:#15803d; --bad:#b91c1c; --accent:#1d4ed8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --line:#44403c; --card:#292524; --ok:#4ade80; --bad:#f87171; --accent:#93c5fd; } }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:900px; margin:0 auto; padding:16px; }
  h1 { font-size:1.3rem; margin:0 0 12px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:12px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:6px 0 2px; }
  input, select, textarea { width:100%; box-sizing:border-box; font:inherit; padding:6px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  textarea { min-height:70px; font-family:ui-monospace, monospace; font-size:.85rem; }
  button { font:inherit; padding:6px 14px; border-radius:6px; border:1px solid var(--line); background:var(--accent); color:#fff; cursor:pointer; }
  button.secondary { background:transparent; color:var(--fg); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .tool { border-left:3px solid var(--accent); padding:4px 8px; margin:6px 0; font-family:ui-monospace, monospace; font-size:.85rem; overflow-wrap:anywhere; }
  .tool.done { border-color:var(--ok); } .tool.failed { border-color:var(--bad); }
  #status { font-weight:600; } #text { white-space:pre-wrap; }
  #log { font-family:ui-monospace, monospace; font-size:.75rem; color:var(--muted); max-height:220px; overflow:auto; white-space:pre-wrap; }
  #approval { border-color:var(--accent); display:none; }
</style>
</head>
<body>
<main>
  <h1>Agent runs</h1>
  <section>
    <label for="token">Access token (from Keycloak)</label>
    <input id="token" type="password" autocomplete="off">
    <div class="row" style="margin-top:8px"><button id="load" class="secondary">Load agents</button></div>
    <label for="agent">Agent</label>
    <select id="agent"></select>
    <label for="input">Input (JSON)</label>
    <textarea id="input">{}</textarea>
    <div class="row" style="margin-top:8px"><button id="start">Start run</button> <span id="status">idle</span></div>
  </section>
  <section id="approval" aria-live="polite">
    <strong>Approval needed</strong>
    <div id="approval-detail" class="tool"></div>
    <label for="approver-token">Approver's access token (someone other than the requester)</label>
    <input id="approver-token" type="password" autocomplete="off">
    <div class="row"><button id="approve">Approve</button><button id="reject" class="secondary">Reject</button></div>
  </section>
  <section><strong>Tool calls</strong><div id="tools"></div></section>
  <section><strong>Answer</strong><div id="text"></div></section>
  <section><strong>AG-UI events</strong><div id="log"></div></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let runId = null, lastId = -1, interrupt = null;
const headers = () => ({ "Authorization": "Bearer " + $("token").value, "Content-Type": "application/json" });
const calls = {};

async function api(path, options = {}) {
  const res = await fetch(path, { ...options, headers: { ...headers(), ...(options.headers || {}) } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function show(event) {
  $("log").textContent += event.type + " " + JSON.stringify(event).slice(0, 200) + "\n";
  $("log").scrollTop = $("log").scrollHeight;
  switch (event.type) {
    case "RUN_STARTED": $("status").textContent = "running"; break;
    case "TOOL_CALL_START": {
      const el = document.createElement("div"); el.className = "tool"; el.dataset.id = event.toolCallId;
      el.textContent = "→ " + event.toolCallName; $("tools").appendChild(el); calls[event.toolCallId] = el; break; }
    case "TOOL_CALL_ARGS": calls[event.toolCallId].textContent += " " + event.delta; break;
    case "TOOL_CALL_RESULT": {
      const el = calls[event.toolCallId]; const body = JSON.parse(event.content || "null");
      el.className = "tool " + (body && body.error ? "failed" : "done");
      el.textContent += "\n  ← " + event.content; break; }
    case "TEXT_MESSAGE_CONTENT": $("text").textContent += event.delta; break;
    case "RUN_FINISHED": {
      const outcome = event.outcome || {};
      if (outcome.type === "interrupt") {
        interrupt = outcome.interrupts[0];
        $("approval-detail").textContent = (interrupt.message || "") + "\n" + JSON.stringify(interrupt.metadata, null, 2);
        $("approval").style.display = "block"; $("status").textContent = "waiting for approval";
      } else { $("status").textContent = (event.result && event.result.status) || outcome.type; }
      break; }
    case "RUN_ERROR": $("status").textContent = "failed: " + event.message; break;
  }
}

async function follow() {
  const res = await fetch(`/v1/runs/${runId}/events?after=${lastId}`, { headers: headers() });
  if (!res.ok) { $("status").textContent = "events: " + res.status; return; }
  const reader = res.body.getReader(); const decoder = new TextDecoder(); let buffer = "";
  for (;;) {
    const { value, done } = await reader.read(); if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let cut;
    while ((cut = buffer.indexOf("\n\n")) >= 0) {
      const frame = buffer.slice(0, cut); buffer = buffer.slice(cut + 2);
      let id = null, data = "";
      for (const line of frame.split("\n")) {
        if (line.startsWith("id: ")) id = Number(line.slice(4));
        else if (line.startsWith("data: ")) data += line.slice(6);
      }
      if (id !== null) lastId = id;
      if (data) show(JSON.parse(data));
    }
  }
}

$("load").onclick = async () => {
  try {
    const { agents } = await api("/v1/agents");
    $("agent").innerHTML = agents.map((a) => `<option>${a.name}</option>`).join("");
  } catch (e) { $("status").textContent = e.message; }
};
$("start").onclick = async () => {
  try {
    const input = JSON.parse($("input").value || "{}");
    const run = await api(`/v1/agents/${$("agent").value}/runs`, {
      method: "POST", body: JSON.stringify({ input }),
      headers: { "Idempotency-Key": crypto.randomUUID() } });
    runId = run.run_id; lastId = -1; $("tools").innerHTML = ""; $("text").textContent = ""; $("log").textContent = "";
    await follow();
  } catch (e) { $("status").textContent = e.message; }
};
async function decide(approved) {
  try {
    $("approval").style.display = "none";
    await api(`/v1/runs/${runId}/approvals`, {
      method: "POST", body: JSON.stringify({ approved }),
      headers: { "Authorization": "Bearer " + ($("approver-token").value || $("token").value) } });
    await follow();
  } catch (e) { $("status").textContent = e.message; }
}
$("approve").onclick = () => decide(true);
$("reject").onclick = () => decide(false);
</script>
</body>
</html>
