[project]
name = "mcp-gateway"
version = "0.1.0"
description = "Platform MCP server: platform tools, rag-core search and allowlisted external servers behind Keycloak auth, OPA and audit"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-audit",
    "agent-contracts",
    "agent-spec",
    "agent-tools",
    "mcp>=2.3.0,<2.4",
    "uvicorn>=0.54.0,<1",
    "starlette>=0.48",
]

[project.scripts]
mcp-gateway = "mcp_gateway.__main__:main"

[tool.uv.sources]
agent-audit = { workspace = true }
agent-contracts = { workspace = true }
agent-spec = { workspace = true }
agent-tools = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway"]
