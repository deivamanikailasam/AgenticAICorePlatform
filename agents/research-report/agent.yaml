# Reference app 2 (Step 40): a multi-agent research and report generator. A supervisor team
# (workers/team.yaml: researcher, analyst, writer and critic) writes and reviews a cited report;
# the report is published only after a person approves exactly that report. Publishing is
# irreversible, so the platform refuses it without the approval step.
spec_version: 1
name: research-report
version: 0.2.0
owner: agent-platform
description: Researches a question with a team of agents, has the cited report reviewed, and publishes it after approval.
risk_tier: medium
autonomy: hybrid
pattern: hybrid
models: { default: local-qwen-fast, planner: local-qwen-quality }
runtime: { adapter: langgraph, durability: checkpoint }
budgets: { max_steps: 12, max_tokens: 60000, max_cost_aud: 0.50, max_wall_seconds: 600 }
tools:
  - ref: local://platform/publish_report     # irreversible -> approval required
    approval: { required: true, approvers: "group:approvers" }
guardrails: [prompt_injection, tool_args_schema]
graph:
  nodes:
    - { id: research, type: subgraph, spec: workers/team.yaml, config: { inputs: { task: $input.task } } }
    - id: publish
      type: tool
      tool: publish_report
      config: { args: { title: $input.task, report: $research.answer } }
  edges:
    - { from: research, to: publish, when: on_ok }   # a team that fails publishes nothing
evals: { suite: evals/apps/research-report, gates: default }
