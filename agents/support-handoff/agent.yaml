# Reference spec for pattern: handoff (Step 23).
spec_version: 1
name: support-handoff
version: 0.1.0
owner: agent-platform
description: Triage hands customers to billing or technical support (swarm handoff).
risk_tier: low
autonomy: multi_agent
pattern: handoff
models: { default: local-qwen-fast, planner: local-qwen-quality }
runtime: { adapter: langgraph, durability: checkpoint }
budgets: { max_steps: 30, max_tokens: 60000, max_cost_aud: 0.30, max_wall_seconds: 300 }
agents:
  - { name: triage, spec: workers/triage.yaml, role: First contact }
  - { name: billing, spec: workers/billing.yaml, role: Refunds and invoices }
  - { name: tech, spec: workers/tech.yaml, role: Logins and errors }
team:
  entry: triage
  handoffs: { triage: [billing, tech], billing: [tech], tech: [billing] }
  max_turns: 4
