spec_version: 1
name: support-handoff-billing
version: 0.1.0
owner: agent-platform
description: Handles refunds, invoices and payments.
risk_tier: low
autonomy: hybrid
pattern: hybrid
models: { default: local-qwen-fast }
runtime: { adapter: langgraph, durability: memory }
budgets: { max_steps: 4, max_tokens: 8000, max_cost_aud: 0.05, max_wall_seconds: 60 }
graph:
  nodes:
    - id: act
      type: agent
      pattern: react
      config:
        template: "Customer request: $input.task. Notes from colleagues: $input.handoffs. Resolve it."
        output_schema: { type: object, properties: { handoff_to: { type: string }, note: { type: string }, answer: { type: string } } }
