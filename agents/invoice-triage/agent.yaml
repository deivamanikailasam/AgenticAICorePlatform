# The spec's example, in the exact v1 layout, completed as the hybrid reference app (Step 15):
# deterministic validation, an agentic node for exceptions, and an irreversible payment behind a
# human approval. Functions and the demo ERP server live in apps/invoice-triage.
spec_version: 1
name: invoice-triage
version: 0.3.0
owner: finance-platform
description: Validates invoices, resolves exceptions with an agent, pays after approval.
risk_tier: medium
autonomy: hybrid
pattern: hybrid
models:
  default: local-qwen-fast
  planner: local-qwen-quality
runtime: { adapter: langgraph, durability: checkpoint }
budgets: { max_steps: 25, max_tokens: 60000, max_cost_aud: 0.50, max_wall_seconds: 300 }
tools:
  - ref: mcp://erp/get_invoice          # read
  - ref: mcp://erp/post_payment         # irreversible -> approval required
    approval: { required: true, approvers: "group:finance-approvers" }
  - ref: mcp://rag-core/search          # Project 0 retrieval as a tool
memory: { short_term: checkpoint, long_term: { store: pgvector, scope: tenant } }
guardrails: [prompt_injection, pii_redaction, tool_args_schema, output_schema]
graph:
  nodes:
    - { id: validate, type: function, fn: invoice.validate }
    - id: resolve_exceptions
      type: agent
      pattern: react
      model: planner
      tools: [get_invoice, search]
      config:
        template: "Invoice $input.invoice.id failed validation: ${validate.error}. Check it with get_invoice and the payment policy with search, then decide what to pay."
        output_schema:
          type: object
          properties:
            invoice_id: { type: string }
            amount: { type: number, exclusiveMinimum: 0 }
            currency: { type: string, enum: [AUD] }
            resolution: { type: string }
          required: [invoice_id, amount, currency, resolution]
    - { id: prepare_payment, type: function, fn: invoice.payment_details }
    - id: pay
      type: tool
      tool: post_payment
      config:
        args: { invoice_id: $prepare_payment.invoice_id, amount_aud: $prepare_payment.amount_aud, currency: $prepare_payment.currency }
  edges:
    - "validate -> resolve_exceptions: on_error"
    - "validate -> prepare_payment: on_ok"
    - "resolve_exceptions -> prepare_payment"
    - "prepare_payment -> pay: on_ok"
evals: { suite: evals/invoice-triage, gates: default }
