spec_version: 1
name: batch-summary-reducer
version: 0.1.0
owner: agent-platform
description: Combines the one-line summaries into a digest.
risk_tier: low
autonomy: hybrid
pattern: hybrid
models: { default: local-qwen-fast }
runtime: { adapter: langgraph, durability: memory }
budgets: { max_steps: 4, max_tokens: 8000, max_cost_aud: 0.05, max_wall_seconds: 60 }
graph:
  nodes:
    - id: act
      type: agent
      pattern: react
      config:
        template: "Goal: $input.task. Combine these summaries into a short digest: $input.results"
        output_schema: { type: object, properties: { message: { type: string } }, required: [message] }
