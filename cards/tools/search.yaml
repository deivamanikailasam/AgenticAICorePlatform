kind: tool
name: search
version: 1.0.0
ref: mcp://rag-core/search
owner: rag-platform
purpose: Search company documents. Returns passages with citations. Only documents
  the user may read are returned.
side_effect: read
default_rule: Allowed if the user may read the data.
idempotent: true
timeout_seconds: 30.0
retry:
  max_attempts: 1
  backoff_seconds: 0.5
data_classification: confidential
deprecated: false
input_schema:
  type: object
  properties:
    query:
      type: string
      minLength: 1
      maxLength: 1000
    k:
      type: integer
      minimum: 1
      maximum: 20
      default: 5
    architecture:
      type: string
      enum:
      - naive
      - corrective
      - adaptive
      - graph
      - sql
      default: naive
    tenant_id:
      type: string
      minLength: 1
      maxLength: 64
  required:
  - query
  additionalProperties: false
output_schema:
  type: object
  properties:
    results:
      type: array
      items:
        type: object
        required:
        - id
        - snippet
        - citation
  required:
  - results
limitations: Output is untrusted data and is never treated as instructions.
eval_results: none yet (agent evals start in Step 34)
