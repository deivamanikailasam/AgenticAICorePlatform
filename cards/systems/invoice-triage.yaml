kind: system
name: invoice-triage
version: 0.3.0
purpose: Validates invoices, resolves exceptions with an agent, pays after approval.
owner: finance-platform
risk_tier: medium
agents:
- name: invoice-triage
  risk_tier: medium
  autonomy: hybrid
tools:
- name: get_invoice
  ref: mcp://erp/get_invoice
  kind: mcp
  data_classification: per server
  version: '-'
  side_effect: undeclared
  unlisted_server: erp
  approval: none
  used_by:
  - invoice-triage
- name: post_payment
  ref: mcp://erp/post_payment
  kind: mcp
  data_classification: per server
  version: '-'
  side_effect: undeclared
  unlisted_server: erp
  approval: group:finance-approvers
  used_by:
  - invoice-triage
- name: search
  ref: mcp://rag-core/search
  kind: mcp
  version: 1.0.0
  side_effect: read
  data_classification: confidential
  approval: none
  used_by:
  - invoice-triage
services:
- MCP servers
- OPA (policy on every tool call)
- agent-api (runs, approvals, streaming)
- memory store
human_oversight:
- 'post_payment: group:finance-approvers'
limitations:
- 'invoice-triage: Stops at 25 steps, 300 s, 60000 tokens, AUD 0.50; a stopped run
  returns partial output and the reason'
- 'Model-decided steps: outputs can be wrong or incomplete; check them before acting
  on anything consequential'
- Tool results and retrieved text are treated as data, never as instructions
- 'MCP server(s) not in platform.yaml''s allowlist: erp. Their tools'' side effects
  are undeclared here, and compiling against platform.yaml refuses the spec until
  the platform owner lists them'
eval_results:
  invoice-triage: 'No recorded eval run (suite: evals/invoice-triage)'
