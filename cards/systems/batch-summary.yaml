kind: system
name: batch-summary
version: 0.1.0
purpose: Summarises many documents in parallel, then combines them (map-reduce).
owner: agent-platform
risk_tier: low
agents:
- name: batch-summary
  risk_tier: low
  autonomy: multi_agent
- name: batch-summary-mapper
  risk_tier: low
  autonomy: hybrid
- name: batch-summary-reducer
  risk_tier: low
  autonomy: hybrid
tools: []
services:
- OPA (policy on every tool call)
- agent-api (runs, approvals, streaming)
human_oversight:
- No tool needs approval
limitations:
- 'batch-summary: Stops at 30 steps, 300 s, 60000 tokens, AUD 0.30; a stopped run
  returns partial output and the reason'
- 'Model-decided steps: outputs can be wrong or incomplete; check them before acting
  on anything consequential'
- Tool results and retrieved text are treated as data, never as instructions
- Delegates to 2 worker(s), at most 2 levels deep; each worker has its own tools and
  budget
- 'batch-summary-mapper: Stops at 4 steps, 60 s, 8000 tokens, AUD 0.05; a stopped
  run returns partial output and the reason'
- 'batch-summary-reducer: Stops at 4 steps, 60 s, 8000 tokens, AUD 0.05; a stopped
  run returns partial output and the reason'
eval_results:
  batch-summary: 'No recorded eval run (suite: none declared)'
  batch-summary-mapper: 'No recorded eval run (suite: none declared)'
  batch-summary-reducer: 'No recorded eval run (suite: none declared)'
