kind: system
name: research-report
version: 0.1.0
purpose: Researches a question, works out the figures and writes a short cited report.
owner: agent-platform
risk_tier: low
agents:
- name: research-report
  risk_tier: low
  autonomy: multi_agent
- name: research-report-analyst
  risk_tier: low
  autonomy: hybrid
- name: research-report-researcher
  risk_tier: low
  autonomy: hybrid
- name: research-report-writer
  risk_tier: low
  autonomy: hybrid
tools:
- name: calculator
  ref: local://platform/calculator
  kind: local
  version: 1.0.0
  side_effect: read
  data_classification: public
  approval: none
  used_by:
  - research-report-analyst
- name: word_count
  ref: local://platform/word_count
  kind: local
  version: 1.0.0
  side_effect: read
  data_classification: internal
  approval: none
  used_by:
  - research-report-writer
- name: search
  ref: mcp://rag-core/search
  kind: mcp
  version: 1.0.0
  side_effect: read
  data_classification: confidential
  approval: none
  used_by:
  - research-report-researcher
services:
- MCP servers
- OPA (policy on every tool call)
- agent-api (runs, approvals, streaming)
human_oversight:
- No tool needs approval
limitations:
- 'research-report: Stops at 12 steps, 300 s, 60000 tokens, AUD 0.50; a stopped run
  returns partial output and the reason'
- 'Model-decided steps: outputs can be wrong or incomplete; check them before acting
  on anything consequential'
- Tool results and retrieved text are treated as data, never as instructions
- Delegates to 3 worker(s), at most 2 levels deep; each worker has its own tools and
  budget
- 'research-report-analyst: Stops at 6 steps, 120 s, 20000 tokens, AUD 0.10; a stopped
  run returns partial output and the reason'
- 'research-report-researcher: Stops at 6 steps, 120 s, 20000 tokens, AUD 0.15; a
  stopped run returns partial output and the reason'
- 'research-report-writer: Stops at 6 steps, 120 s, 20000 tokens, AUD 0.10; a stopped
  run returns partial output and the reason'
eval_results:
  research-report: 'No recorded eval run (suite: none declared)'
  research-report-analyst: 'No recorded eval run (suite: none declared)'
  research-report-researcher: 'No recorded eval run (suite: none declared)'
  research-report-writer: 'No recorded eval run (suite: none declared)'
