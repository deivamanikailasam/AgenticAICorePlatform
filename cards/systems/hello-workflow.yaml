kind: system
name: hello-workflow
version: 0.1.0
purpose: Greets the caller. Proves spec -> compiler -> runtime -> trace.
owner: agent-platform
risk_tier: low
agents:
- name: hello-workflow
  risk_tier: low
  autonomy: workflow
tools: []
services:
- OPA (policy on every tool call)
- agent-api (runs, approvals, streaming)
human_oversight:
- No tool needs approval
limitations:
- 'hello-workflow: Stops at 5 steps, 10 s; a stopped run returns partial output and
  the reason'
- Tool results and retrieved text are treated as data, never as instructions
eval_results:
  hello-workflow: 'No recorded eval run (suite: none declared)'
