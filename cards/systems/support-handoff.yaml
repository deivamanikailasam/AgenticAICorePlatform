kind: system
name: support-handoff
version: 0.1.0
purpose: Triage hands customers to billing or technical support (swarm handoff).
owner: agent-platform
risk_tier: low
agents:
- name: support-handoff
  risk_tier: low
  autonomy: multi_agent
- name: support-handoff-billing
  risk_tier: low
  autonomy: hybrid
- name: support-handoff-tech
  risk_tier: low
  autonomy: hybrid
- name: support-handoff-triage
  risk_tier: low
  autonomy: hybrid
tools: []
services:
- OPA (policy on every tool call)
- agent-api (runs, approvals, streaming)
human_oversight:
- No tool needs approval
limitations:
- 'support-handoff: Stops at 30 steps, 300 s, 60000 tokens, AUD 0.30; a stopped run
  returns partial output and the reason'
- 'Model-decided steps: outputs can be wrong or incomplete; check them before acting
  on anything consequential'
- Tool results and retrieved text are treated as data, never as instructions
- Delegates to 3 worker(s), at most 2 levels deep; each worker has its own tools and
  budget
- 'support-handoff-billing: Stops at 4 steps, 60 s, 8000 tokens, AUD 0.05; a stopped
  run returns partial output and the reason'
- 'support-handoff-tech: Stops at 4 steps, 60 s, 8000 tokens, AUD 0.05; a stopped
  run returns partial output and the reason'
- 'support-handoff-triage: Stops at 4 steps, 60 s, 8000 tokens, AUD 0.05; a stopped
  run returns partial output and the reason'
eval_results:
  support-handoff: 'No recorded eval run (suite: none declared)'
  support-handoff-billing: 'No recorded eval run (suite: none declared)'
  support-handoff-tech: 'No recorded eval run (suite: none declared)'
  support-handoff-triage: 'No recorded eval run (suite: none declared)'
