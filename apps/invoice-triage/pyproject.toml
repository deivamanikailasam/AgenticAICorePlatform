[project]
name = "invoice-triage"
version = "0.3.0"
description = "Hybrid reference app (Step 15): invoice validation functions and a demo ERP MCP server for agents/invoice-triage"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=2.3.0,<2.4",
]

[project.entry-points."agent_platform.functions"]
"invoice.validate" = "invoice_triage.functions:validate"
"invoice.payment_details" = "invoice_triage.functions:payment_details"

[project.scripts]
invoice-triage-erp = "invoice_triage.erp_server:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_triage"]
