# Project A services. They join Project 0's Docker network (external) and reach its services
# by name. Service names below are Project 0's assumed names — VERIFY-ON-MAC against
# ~/dev/rag-platform/infra/compose. Ports bind to 127.0.0.1; images are pinned by digest.
name: agent-platform

networks:
  default:
    name: ${P0_NETWORK:-rag-platform}
    external: true

secrets:
  extra_ca:
    file: ${EXTRA_CA_BUNDLE:-./no-extra-ca.pem}

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  tmpfs: ["/tmp:size=64m"]

x-p0-endpoints: &p0-endpoints
  P0_LITELLM_URL: http://litellm:4000
  P0_POSTGRES_DSN: ${P0_POSTGRES_DSN_INTERNAL:-postgresql://agent_health@postgres:5432/postgres}
  P0_VALKEY_URL: redis://valkey:6379/0
  P0_KEYCLOAK_URL: http://keycloak:8080
  # the issuer in users' tokens (Keycloak as their browsers reach it); VERIFY-ON-MAC
  P0_KEYCLOAK_PUBLIC_URL: ${P0_KEYCLOAK_PUBLIC_URL:-http://127.0.0.1:8080}
  P0_KEYCLOAK_REALM: ${P0_KEYCLOAK_REALM:-rag-platform}
  P0_OPA_URL: http://opa:8181
  P0_OTEL_HEALTH_URL: http://otel-collector:13133/
  # GenAI spans (Step 30): Project 0's collector, without content
  P0_OTEL_OTLP_ENDPOINT: ${P0_OTEL_OTLP_ENDPOINT_INTERNAL:-http://otel-collector:4318}
  # Langfuse (Step 30): set host and public key to send redacted content there; the secret key
  # comes from OpenBao (langfuse/agent-platform#secret_key). VERIFY-ON-MAC: Project 0's host
  LANGFUSE_HOST: ${LANGFUSE_HOST_INTERNAL:-}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  # secrets and tool credentials (Step 29): Project 0's OpenBao. VERIFY-ON-MAC: name and port
  P0_OPENBAO_URL: ${P0_OPENBAO_URL_INTERNAL:-http://openbao:8200}
  # PII guardrail (Step 27): Project 0's Presidio services. VERIFY-ON-MAC: names and ports
  P0_PRESIDIO_ANALYZER_URL: ${P0_PRESIDIO_ANALYZER_URL_INTERNAL:-http://presidio-analyzer:3000}
  P0_PRESIDIO_ANONYMIZER_URL: ${P0_PRESIDIO_ANONYMIZER_URL_INTERNAL:-http://presidio-anonymizer:3000}

services:
  # One-shot: proves Project A can reach every Project 0 dependency from inside the network.
  agent-health:
    build: { context: ../.., dockerfile: infra/compose/ops.Dockerfile, secrets: [extra_ca] }
    image: agent-platform/ops:dev
    environment: *p0-endpoints
    restart: "no"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 128m

  # The platform MCP server (Step 8): platform tools, rag-core search and allowlisted external
  # servers behind Keycloak auth, OPA and audit.
  mcp-gateway:
    build: { context: ../.., dockerfile: infra/compose/service.Dockerfile, args: { PACKAGE: mcp-gateway }, secrets: [extra_ca] }
    image: agent-platform/mcp-gateway:dev
    command: ["mcp-gateway"]
    <<: *hardening
    environment:
      <<: *p0-endpoints
      MCP_GATEWAY_HOST: 0.0.0.0
      MCP_GATEWAY_PORT: "8090"
      MCP_GATEWAY_PUBLIC_URL: ${MCP_GATEWAY_PUBLIC_URL:-http://127.0.0.1:8090}
      MCP_GATEWAY_ALLOWED_HOSTS: 127.0.0.1:*,localhost:*,mcp-gateway:*
      MCP_GATEWAY_AUDIT_FILE: /tmp/mcp-gateway-audit.jsonl
      P0_RAG_CORE_URL: ${P0_RAG_CORE_URL_INTERNAL:-http://rag-core:8000}
      # which policy decision point decides tool calls: opa (default, Project 0's OPA) | cerbos,
      # optionally with OpenFGA relationship checks: opa+openfga | cerbos+openfga
      MCP_GATEWAY_PDP: ${MCP_GATEWAY_PDP:-opa}
      AGENT_CERBOS_URL: http://cerbos:3592
      AGENT_OPENFGA_URL: http://openfga:8080
      SECRET__OPENFGA__AGENT_PLATFORM__PRESHARED_KEY: ${OPENFGA_PRESHARED_KEY_DEV:-}
      # Step 29: with the runtime's AppRole set, secrets come from OpenBao; without it (dev/CI),
      # from the env var below
      AGENT_BAO_ROLE_ID: ${AGENT_BAO_ROLE_ID:-}
      AGENT_BAO_SECRET_ID: ${AGENT_BAO_SECRET_ID:-}
      SECRET__KEYCLOAK__AGENT_PLATFORM__CLIENT_SECRET: ${AGENT_PLATFORM_CLIENT_SECRET_DEV:-}
    ports: ["127.0.0.1:8090:8090"]
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/healthz')"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # The run API (Step 17): create, stream (AG-UI over SSE or WebSocket), approve, cancel.
  agent-api:
    build: { context: ../.., dockerfile: infra/compose/service.Dockerfile, args: { PACKAGE: agent-api }, secrets: [extra_ca] }
    image: agent-platform/agent-api:dev
    command: ["agent-api"]
    <<: *hardening
    environment:
      <<: *p0-endpoints
      AGENT_API_HOST: 0.0.0.0
      AGENT_API_PORT: "8091"
      AGENT_API_AGENTS_DIR: /app/agents
      AGENT_API_AUDIT_FILE: /tmp/agent-api-audit.jsonl
      AGENT_API_PDP: ${AGENT_API_PDP:-opa}
      # Step 25: dev | staging | prod (staging and prod run only approved agents). The registry
      # is Postgres when AGENT_DB_DSN is set, else a local file (dev only)
      AGENT_ENV: ${AGENT_ENV:-dev}
      AGENT_REGISTRY_FILE: /tmp/agents.db
      # Step 18: memory (default) | postgres (runs and encrypted checkpoints in the agent DB)
      AGENT_API_STORE: ${AGENT_API_STORE:-memory}
      # the agent database: durable runs (Step 18) and agents' long-term memory (Step 20)
      AGENT_DB_DSN: ${AGENT_DB_DSN_INTERNAL:-}
      # dev/CI only: the checkpoint key as an env var; production resolves it from OpenBao (Step 29)
      SECRET__AGENT_PLATFORM__CHECKPOINTS__KEY: ${AGENT_CHECKPOINT_KEY_DEV:-}
      AGENT_CERBOS_URL: http://cerbos:3592
      P0_RAG_CORE_URL: ${P0_RAG_CORE_URL_INTERNAL:-http://rag-core:8000}
      # Step 29: with the runtime's AppRole set, secrets come from OpenBao and each agent acts
      # as its own identity; without it (dev/CI), the env var below and the platform identity
      AGENT_BAO_ROLE_ID: ${AGENT_BAO_ROLE_ID:-}
      AGENT_BAO_SECRET_ID: ${AGENT_BAO_SECRET_ID:-}
      SECRET__KEYCLOAK__AGENT_PLATFORM__CLIENT_SECRET: ${AGENT_PLATFORM_CLIENT_SECRET_DEV:-}
    volumes:
      - ../../agents:/app/agents:ro
    ports: ["127.0.0.1:8091:8091"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8091/healthz')"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # The A2A gateway (Step 24, ADR 0035): agents whose spec sets interop.a2a_publish, as A2A v1.x
  # agents with signed Agent Cards. Tasks run through agent-api as the calling user.
  a2a-gateway:
    build: { context: ../.., dockerfile: infra/compose/service.Dockerfile, args: { PACKAGE: a2a-gateway }, secrets: [extra_ca] }
    image: agent-platform/a2a-gateway:dev
    command: ["a2a-gateway"]
    <<: *hardening
    environment:
      <<: *p0-endpoints
      A2A_GATEWAY_HOST: 0.0.0.0
      A2A_GATEWAY_PORT: "8092"
      A2A_PUBLIC_URL: ${A2A_PUBLIC_URL:-http://127.0.0.1:8092}
      A2A_GATEWAY_AGENTS_DIR: /app/agents
      A2A_GATEWAY_AUDIT_FILE: /tmp/a2a-gateway-audit.jsonl
      A2A_GATEWAY_PDP: ${A2A_GATEWAY_PDP:-opa}
      AGENT_API_URL: http://agent-api:8091
      AGENT_CERBOS_URL: http://cerbos:3592
      # dev/CI only: the card-signing key (ES256 PEM) as an env var; production resolves it from
      # OpenBao (Step 29)
      SECRET__AGENT_PLATFORM__A2A__SIGNING_KEY: ${A2A_SIGNING_KEY_DEV:-}
    volumes:
      - ../../agents:/app/agents:ro
    ports: ["127.0.0.1:8092:8092"]
    mem_limit: 384m
    depends_on: [agent-api]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8092/healthz')"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # Durable long runs (Step 19, ADR 0030): started by `just up` (or alone: `just up-temporal`). Development server with its state in
  # a SQLite file on a volume, so runs survive a server restart. Production: Temporal with
  # Postgres or Temporal Cloud (docs/setup/production.md). Project 0 does not run Temporal.
  temporal:
    image: docker.io/temporalio/temporal:1.9.1@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db", "--ui-port", "8233"]
    <<: *hardening
    volumes:
      - temporal-data:/home/temporal
    ports: ["127.0.0.1:7233:7233", "127.0.0.1:8233:8233"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 3s
      retries: 30
    restart: unless-stopped

  # Step 19: runs the nodes of every `durability: temporal` agent as Temporal activities.
  agent-worker:
    build: { context: ../.., dockerfile: infra/compose/service.Dockerfile, args: { PACKAGE: agent-worker }, secrets: [extra_ca] }
    image: agent-platform/agent-worker:dev
    command: ["agent-worker"]
    <<: *hardening
    environment:
      <<: *p0-endpoints
      TEMPORAL_ADDRESS: temporal:7233
      AGENT_API_AGENTS_DIR: /app/agents
      AGENT_API_PDP: ${AGENT_API_PDP:-opa}
      AGENT_ENV: ${AGENT_ENV:-dev}
      AGENT_REGISTRY_FILE: /tmp/agents.db
      AGENT_CERBOS_URL: http://cerbos:3592
      AGENT_WORKER_AUDIT_FILE: /tmp/agent-worker-audit.jsonl
      P0_RAG_CORE_URL: ${P0_RAG_CORE_URL_INTERNAL:-http://rag-core:8000}
      # Step 29: with the runtime's AppRole set, secrets come from OpenBao and each agent acts
      # as its own identity; without it (dev/CI), the env var below and the platform identity
      AGENT_BAO_ROLE_ID: ${AGENT_BAO_ROLE_ID:-}
      AGENT_BAO_SECRET_ID: ${AGENT_BAO_SECRET_ID:-}
      SECRET__KEYCLOAK__AGENT_PLATFORM__CLIENT_SECRET: ${AGENT_PLATFORM_CLIENT_SECRET_DEV:-}
    volumes:
      - ../../agents:/app/agents:ro
    depends_on:
      temporal: { condition: service_healthy }
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('temporal',7233),2)"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # Alternative policy decision point (Step 10, ADR 0020): `docker compose --profile cerbos up`
  # and MCP_GATEWAY_PDP=cerbos. Project 0 does not run Cerbos, so Project A owns it.
  cerbos:
    image: docker.io/cerbos/cerbos:0.56.0@sha256:540643bc67ba628011a150ad1d3370f285daa38995be5cd7a4be181da902bec1
    profiles: [cerbos]
    command: ["server", "--set=storage.driver=disk", "--set=storage.disk.directory=/policies", "--set=storage.disk.watchForChanges=false"]
    environment:
      CERBOS_NO_TELEMETRY: "1"
    volumes:
      - ../../policies/cerbos:/policies:ro
    <<: *hardening
    ports: ["127.0.0.1:3592:3592"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  # Relationship checks (Step 10, ADR 0020): `docker compose --profile openfga up`, then
  # `just provision-openfga`. Memory datastore for dev/CI; production uses Postgres (see
  # docs/setup/production.md). Every API call needs the pre-shared key.
  openfga:
    image: docker.io/openfga/openfga:v1.22.0@sha256:9cf9a20af32a40434cd3a788c429879439ee9ea9abf65c9c200ee17cd43f769e
    profiles: [openfga]
    command: ["run"]
    environment:
      OPENFGA_DATASTORE_ENGINE: memory
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: ${OPENFGA_PRESHARED_KEY_DEV:-}  # empty: OpenFGA refuses to start
      OPENFGA_LOG_FORMAT: json
    <<: *hardening
    ports: ["127.0.0.1:8085:8080"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=127.0.0.1:8081"]
      interval: 3s
      retries: 20
    restart: unless-stopped

volumes:
  temporal-data:
